spring:
  application:
    name: jwtDemo

  profiles:
    active: local


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


# Custom Security JWT Configuration (spring ရဲ့ အပြင်ဘက်မှာ သီးသန့်ထားရပါမည်)
application:
  security:
    jwt:

      expiration: 86400000 # 24 Hours in Milliseconds
      refresh-token:
        expiration: 604800000